<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词雅集</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            max-width:800px;
            margin:0 auto;
            padding:30px 20px;
            background:#f6efe0;
            font-family:"SimSun",serif;
            color:#3a2e1f;
        }
        h1{text-align:center;margin-bottom:20px;}
        .search-box{
            display:flex;
            gap:8px;
            justify-content:center;
            margin-bottom:25px;
        }
        .search-box input{
            width:70%;
            padding:9px 12px;
            border:1px solid #ccc;
            border-radius:4px;
            font-size:15px;
        }
        .search-box button{
            padding:9px 18px;
            border:none;
            background:#a0522d;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        .tab{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:30px;
            flex-wrap:wrap;
        }
        .tab button{
            padding:8px 20px;
            border:none;
            background:#7c684e;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        .tab button.active{background:#a0522d;}
        .tab a{
            padding:8px 20px;
            background:#7c684e;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
        }
        .content{
            background:#fff;
            padding:30px;
            border-radius:8px;
            line-height:2.4;
            font-size:17px;
            min-height:300px;
        }
        /* 每首诗词用 div 包裹，不用 pre-wrap */
        .poem-item{
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #ddd;
        }
        .poem-item:last-child{
            border-bottom: none;
            margin-bottom: 0;
        }
        .poem-title{
            font-weight: bold;
            font-size: 19px;
            margin-bottom: 5px;
        }
        .poem-author{
            color: #666;
            margin-bottom: 10px;
            padding-left: 2em;
        }
        .poem-body{
            line-height: 2.4;
        }
        .highlight{
            color: #d32f2f;
            font-weight: bold;
            background: #ffebee;
            padding: 0 2px;
            border-radius: 2px;
2px;
        }
        .tip{
            text-align:center;
            margin-top:30px;
            color:#888;
            font-size:14px;
        }
        .error{
            color: #c62828;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <h1>诗词雅集</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入关键词搜索诗词、作者、名句" onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="tab">
        <button class="active" data-name="tang">唐诗</button>
        <button data-name="song">宋词</button>
        <button data-name="other">其他</button>
        <a href="https://github.com/chenjiahui7777/chenjiahui7777.github.io/tree/main/poems" target="_blank">录入诗词</a>
    </div>

    <div class="content" id="poemBox">加载中...</div>
    <div class="tip">点击标签切换分类 | 刷新查看最新内容</div>

    <script>
        const baseUrl = "https://chenjiahui7777.github.io/chenjiahui7777.github.io/poems/";

        let poemsData = []; // 存储解析后的诗词数组
        const box = document.getElementById("poemBox");
        const input = document.getElementById("searchInput");
        const btns = document.querySelectorAll(".tab button");

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 解析文本为诗词数组
        function parsePoems(text) {
            const poems = [];
            // 按空行分割，每块是一首诗词
            const blocks = text.split(/\n\s*\n/).filter(b => b.trim());
            
            blocks.forEach(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                if (lines.length === 0) return;
                
                const title = lines[0]; // 第一行是标题
                const author = lines[1] && lines[1].startsWith('—') ? lines[1] : ''; // 第二行可能是作者
                const bodyStart = author ? 2 : 1;
                const body = lines.slice(bodyStart).join('<br>');
                
                poems.push({
                    title: title,
                    author: author,
                    body: body,
                    fullText: block
                });
            });
            
            return poems;
        }

        // 渲染诗词列表
        function renderPoems(poems, highlightKey = '') {
            if (poems.length === 0) {
                box.innerHTML = '<div class="error">暂无内容，快去录入吧</div>';
                return;
            }

            let html = '';
            poems.forEach(poem => {
                let title = escapeHtml(poem.title);
                let author = escapeHtml(poem.author);
                let body = escapeHtml(poem.body.replace(/<<br>/g, '\n')).replace(/\n/g, '<br>');
                
                // 高亮搜索词
                if (highlightKey) {
                    const reg = new RegExp(escapeRegExp(escapeHtml(highlightKey)), 'gi');
                    title = title.replace(reg, m => `<span class="highlight">${m}</span>`);
                    author = author.replace(reg, m => `<span class="highlight">${m}</span>`);
                    body = body.replace(reg, m => `<span class="highlight">${m}</span>`);
                }
                
                html += `
                    <div class="poem-item">
                        <div class="poem-title">${title}</div>
                        ${author ? `<div class="poem-author">${author}</div>` : ''}
                        <div class="poem-body">${body}</div>
                    </div>
                `;
            });
            
            box.innerHTML = html;
        }

        async function loadText(fileName){
            box.innerText = "加载中...";
            try{
                const res = await fetch(baseUrl + fileName + ".txt");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                
                poemsData = parsePoems(text);
                renderPoems(poemsData);
            }catch(err){
                console.error(err);
                box.innerHTML = `<div class="error">加载失败<br><small>${err.message}</small></div>`;
            }
        }

        function doSearch(){
            const key = input.value.trim();
            if(!key){
                renderPoems(poemsData);
                return;
            }
            
            // 过滤包含关键词的诗词
            const filtered = poemsData.filter(p => 
                p.fullText.toLowerCase().includes(key.toLowerCase())
            );
            
            renderPoems(filtered, key);
        }

        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                input.value = "";
                loadText(btn.dataset.name);
            });
        });

        loadText("tang");
    </script>
</body>
</html>
