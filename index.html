<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗词雅集</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            max-width:800px;
            margin:0 auto;
            padding:30px 20px;
            background:#f6efe0;
            font-family:"SimSun",serif;
            color:#3a2e1f;
        }
        h1{text-align:center;margin-bottom:20px;}
        /* 搜索栏 */
        .search-box{
            display:flex;
            gap:8px;
            justify-content:center;
            margin-bottom:25px;
        }
        .search-box input{
            width:70%;
            padding:9px 12px;
            border:1px solid #ccc;
            border-radius:4px;
            font-size:15px;
        }
        .search-box button{
            padding:9px 18px;
            border:none;
            background:#a0522d;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        /* 分类标签 */
        .tab{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:30px;
            flex-wrap:wrap;
        }
        .tab button{
            padding:8px 20px;
            border:none;
            background:#7c684e;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        .tab button.active{background:#a0522d;}
        .tab a{
            padding:8px 20px;
            background:#7c684e;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
        }
        /* 内容区域 */
        .content{
            background:#fff;
            padding:30px;
            border-radius:8px;
            line-height:2.4;
            font-size:17px;
            min-height:300px;
            white-space:pre-wrap;
        }
        .tip{
            text-align:center;
            margin-top:30px;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
<body>
    <h1>诗词雅集</h1>

    <!-- 搜索区域 -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入关键词搜索诗词、作者、名句" onkeydown="if(event.keyCode===13)doSearch()">
        <button onclick="doSearch()">搜索</button>
    </div>

    <!-- 分类切换 -->
    <div class="tab">
        <button class="active" data-name="tang">唐诗</button>
        <button data-name="song">宋词</button>
        <button data-name="other">其他</button>
        <a href="https://github.com/chenjiahui7777/chenjiahui7777.github.io/tree/main/poems" target="_blank">录入诗词</a>
    </div>

    <!-- 诗词展示区 -->
    <div class="content" id="poemBox">加载中...</div>
    <div class="tip">点击标签切换分类 | 刷新查看最新内容</div>

    <script>
        // 已修正为你的正确用户名 chenjiahui7777（四个7）
        const baseUrl = "https://chenjiahui7777.github.io/chenjiahui7777.github.io/poems/";

        let nowText = ""; // 当前分类全文
        const box = document.getElementById("poemBox");
        const input = document.getElementById("searchInput");
        const btns = document.querySelectorAll(".tab button");

        // 加载对应分类文本
        async function loadText(fileName){
            box.innerText = "加载中...";
            try{
                const res = await fetch(baseUrl + fileName + ".txt");
                if (!res.ok) {
                    throw new Error('文件加载失败');
                }
                nowText = await res.text();
                box.innerText = nowText || "暂无内容，快去录入吧";
            }catch(err){
                box.innerText = "加载失败，请稍后重试";
            }
        }

        // 搜索功能
        function doSearch(){
            const key = input.value.trim();
            if(!key){
                box.innerText = nowText;
                return;
            }
            // 按关键词匹配，标红关键词
            const reg = new RegExp(key,"g");
            const result = nowText.replace(reg,`<span style="color:red;">${key}</span>`);
            box.innerHTML = result || "未找到相关诗词";
        }

        // 分类切换绑定事件
        btns.forEach(btn => {
            btn.addEventListener("click",()=>{
                btns.forEach(b=>b.classList.remove("active"));
                btn.classList.add("active");
                input.value = ""; // 清空搜索框
                loadText(btn.dataset.name);
            })
        });

        // 页面默认加载唐诗
        loadText("tang");
    </script>
</body>
</html>
